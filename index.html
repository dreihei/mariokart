<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131f" />
    <title>Neon Apex Rally</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div class="brand">NEON APEX <span>RALLY</span></div>
        <div class="top-left panel">
          <div><small>POSITION</small><strong id="position">1 / 6</strong></div>
          <div><small>RUNDE</small><strong id="lap">1 / 3</strong></div>
        </div>
        <div class="top-right panel">
          <small>ITEM</small><strong id="item">—</strong><span class="key">E</span>
        </div>
        <div class="speed"><strong id="speed">000</strong><span>km/h</span><div class="boost"><i id="boost"></i></div></div>
        <canvas id="minimap" width="240" height="180"></canvas>
        <div id="countdown"></div>
        <div id="message"></div>
        <div id="debugPanel"></div>
        <div id="startMenu" class="overlay start-menu"><div>
          <p class="eyebrow">NEON-HAFENMEISTERSCHAFT</p>
          <h1>NEON APEX</h1>
          <p class="menu-copy">Wähle, wie stark die fünf Rivalen fahren.</p>
          <div class="difficulty" role="group" aria-label="Bot-Schwierigkeit">
            <button data-difficulty="easy"><b>LEICHT</b><span>Fehleranfällig & vorsichtig</span></button>
            <button data-difficulty="medium" class="selected"><b>MITTEL</b><span>Ausgewogen & reaktiv</span></button>
            <button data-difficulty="hard"><b>SCHWER</b><span>Präzise & aggressiv</span></button>
          </div>
          <button id="startRace" class="primary">RENNEN STARTEN</button>
        </div></div>
        <div id="pause" class="overlay hidden"><h1>PAUSE</h1><p>Drücke P zum Fortsetzen</p></div>
        <div id="results" class="overlay hidden"><div><p class="eyebrow">RENNEN BEENDET</p><h1 id="resultTitle">ZIEL!</h1><ol id="resultList"></ol><button id="restartButton">NOCH EINMAL</button></div></div>
        <div id="help"><b>WASD / Pfeile</b> Fahren · <b>Leertaste</b> Driften · <b>E</b> Item · <b>P</b> Pause · <b>R</b> Reset · <b>F3</b> Debug</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
